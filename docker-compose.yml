services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_manager
      POSTGRES_USER: project_manager
      POSTGRES_PASSWORD: project_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_manager -d project_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://project_manager:project_manager@db:5432/project_manager
      APP_ENV: development
      PYTHONPATH: /app/backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    environment:
      API_URL: http://backend:8000
    command: ["uv", "run", "--no-dev", "streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres-data:
